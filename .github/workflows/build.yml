# Packages the verified port and builds the desktop SD Builder on each platform.
name: build
on:
  push:
  pull_request:
  release:
    types: [published]
jobs:
  nro:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Stage verified port binary
        run: cp tools/packaging/sixguns.nro port/sixguns.nro
      - uses: actions/upload-artifact@v4
        with:
          name: sixguns-nro
          path: port/sixguns.nro

  sd-builder:
    needs: nro
    strategy:
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sixguns-nro
          path: port
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: python -m pip install pyinstaller numpy
      - name: Self-test (no game files needed)
        run: python -I -c "import sys; sys.path.insert(0, 'tools'); import build_sd, apk_verify; print('ok', build_sd.PKG)"
      - name: Package
        run: python -m PyInstaller --noconfirm tools/packaging/sd_builder.spec
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "Six Guns SD Builder.app" SixGuns-SD-Builder-macOS.zip
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/Six Guns SD Builder" -DestinationPath dist/SixGuns-SD-Builder-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sd-builder-${{ matrix.os }}
          path: dist/SixGuns-SD-Builder-*.zip
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SixGuns-SD-Builder-*.zip

  release-nro:
    if: github.event_name == 'release'
    needs: nro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sixguns-nro
      - uses: softprops/action-gh-release@v2
        with:
          files: sixguns.nro

